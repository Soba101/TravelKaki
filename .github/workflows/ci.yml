# CI: lint + tests on every push and pull request (issue #4).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs uv (and caches downloads between runs).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest -q
