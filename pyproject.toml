# Project settings for TravelKaki.
# We use uv to manage dependencies: `uv sync` installs everything,
# `uv run <cmd>` runs a command inside the project's virtual env.

[project]
name = "travelkaki"
version = "0.1.0"
description = "An AI trip planner that lives inside your Telegram group chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0",  # Telegram bot framework (we use polling)
    "fastapi>=0.115",             # small web API (mini app later, /health now)
    "uvicorn>=0.30",              # server that runs the FastAPI app
    "sqlalchemy>=2.0",            # database layer (used from M1)
    "litellm>=1.50",              # one client for many LLM providers (used from M1)
    "pydantic-settings>=2.4",     # reads settings from .env
]

[dependency-groups]
# Tools only needed while developing and in CI.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",  # lets pytest run async test functions
    "httpx>=0.27",           # needed by FastAPI's TestClient
    "ruff>=0.6",             # linter + formatter
]

[tool.uv]
# This is an app, not a library we publish, so don't build/install it as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = common errors, I = import order, UP = modern Python syntax, B = likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # async tests run without needing a decorator on each one
